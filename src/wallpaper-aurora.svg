<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <radialGradient id="auroraGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e2238" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0f111c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06070a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="streamGrad1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streamGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#auroraGlow)"/>

  <!-- Aurora Ribbon 1 -->
  <path d="M-100,520 Q300,280 800,420 T1700,340 T2100,480 L2100,1080 L-100,1080 Z" fill="url(#streamGrad1)"/>
  
  <!-- Aurora Ribbon 2 -->
  <path d="M-100,600 Q450,380 950,500 T1850,420 T2100,580 L2100,1080 L-100,1080 Z" fill="url(#streamGrad2)"/>

  <!-- Minimalist Ridge -->
  <polygon points="-50,1080 340,680 720,1080" fill="#0b0d14"/>
  <polygon points="340,680 720,1080 580,1080" fill="#131722"/>
  <line x1="340" y1="680" x2="580" y2="1080" stroke="#333b52" stroke-width="1.2"/>

  <polygon points="560,1080 1020,580 1480,1080" fill="#080a0f"/>
  <polygon points="1020,580 1480,1080 1280,1080" fill="#10131c"/>
  <line x1="1020" y1="580" x2="1280" y2="1080" stroke="#2c3346" stroke-width="1.2"/>

  <polygon points="1320,1080 1680,640 2040,1080" fill="#0c0e16"/>
  <polygon points="1680,640 2040,1080 1880,1080" fill="#141824"/>
  <line x1="1680" y1="640" x2="1880" y2="1080" stroke="#373f56" stroke-width="1.2"/>

  <!-- Geometric Horizon Grid -->
  <line x1="0" y1="780" x2="1920" y2="780" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="860" x2="1920" y2="860" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="960" x2="1920" y2="960" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
</svg>
